<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Voluntariado</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="container"><h1>🤝 Mãos que Cuidam</h1><button class="menu-hamburguer" id="btn-menu"><span></span><span></span><span></span></button><nav id="menu-nav"><ul><li><a href="index.html">Início</a></li><li><a href="projetos.html">Projetos</a></li><li><a href="cadastro.html" class="ativo">Voluntariado</a></li></ul></nav></div></header>
<main class="container">
<section class="hero"><h2>Quero ser voluntário</h2><p>Preencha seus dados</p></section>
<section><div class="card" style="max-width:600px;margin:0 auto;">
<form id="formVoluntario" novalidate>
<label>Nome completo*</label><input type="text" id="nome" required><span id="erro-nome" class="mensagem-erro"></span>
<label>E-mail*</label><input type="email" id="email" required><span id="erro-email" class="mensagem-erro"></span>
<label>Telefone</label><input type="tel" id="telefone">
<label>Projeto</label><select id="projeto"><option>Saúde</option><option>Educação</option><option>Acolhimento</option></select>
<label>Por que quer ser voluntário?</label><textarea id="motivo" style="height:100px;"></textarea>
<div id="feedback-form" style="margin-top:1rem;"></div>
<button type="submit" class="botao" style="width:100%;margin-top:1rem;">Enviar Cadastro</button>
</form>
</div></section>
</main>
<footer><p>© 2026 ONG Mãos que Cuidam</p></footer>
<div class="toast" id="toast"></div>
<script src="js/bundle.js"></script>
</body>
</html>

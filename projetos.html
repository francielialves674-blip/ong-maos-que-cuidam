<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos - Mãos que Cuidam</title>
<style>
:root{--verde:#2E7D32;--amarelo:#FFC107;--foco:#005FCC}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;background:var(--verde);color:#fff;padding:8px;z-index:9999}
:focus-visible{outline:3px solid var(--foco);outline-offset:3px}
header{background:var(--verde);color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}
nav ul{list-style:none;display:flex;gap:1rem} nav a{color:#fff;text-decoration:none;font-weight:bold;padding:6px}
#btn-menu{display:none;background:var(--amarelo);border:0;padding:8px 12px;font-weight:bold;cursor:pointer}
main{padding:2rem}.filtros{margin:1rem 0}.filtros button{padding:8px 14px;margin:4px;border:2px solid var(--verde);background:#fff;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--verde);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.card{border:1px solid #ccc;padding:1rem;border-left:5px solid var(--verde)}.card:focus{outline:3px solid var(--foco)}
footer{background:#222;color:#fff;text-align:center;padding:1rem;margin-top:2rem}
@media(max-width:700px){#btn-menu{display:block} nav ul{display:none;flex-direction:column;position:absolute;top:60px;left:0;width:100%;background:var(--verde);padding:1rem} nav ul.aberto{display:flex}}
</style>
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header><h1>Mãos que Cuidam</h1><button id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">☰ Menu</button><nav aria-label="Principal"><ul id="menu-principal"><li><a href="index.html">Início</a></li><li><a href="projetos.html" aria-current="page">Projetos</a></li><li><a href="cadastro.html">Seja Voluntário</a></li></ul></nav></header>
<main id="conteudo" tabindex="-1">
<h2>Nossos Projetos</h2>
<div class="filtros" role="group" aria-label="Filtrar projetos por categoria"><button aria-pressed="true" data-f="todos">Todos</button><button aria-pressed="false" data-f="educacao">Educação</button><button aria-pressed="false" data-f="saude">Saúde</button></div>
<div class="cards" role="list">
<article class="card" role="listitem" tabindex="0" data-cat="educacao"><h3>Reforço Escolar</h3><p>Aulas gratuitas para crianças.</p></article>
<article class="card" role="listitem" tabindex="0" data-cat="saude"><h3>Saúde na Comunidade</h3><p>Atendimento e prevenção.</p></article>
<article class="card" role="listitem" tabindex="0" data-cat="educacao"><h3>Oficina de Leitura</h3><p>Incentivo à leitura.</p></article>
</div>
</main>
<footer>ONG Mãos que Cuidam © 2026</footer>
<script>
const btn=document.getElementById('btn-menu');const menu=document.getElementById('menu-principal');
btn.addEventListener('click',()=>{const a=menu.classList.toggle('aberto');btn.setAttribute('aria-expanded',a)});
document.querySelectorAll('.filtros button').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.filtros button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const f=b.dataset.f;document.querySelectorAll('.card').forEach(c=>{c.style.display=(f==='todos'||c.dataset.cat===f)?'block':'none'})})});
</script>
</body>
</html>
